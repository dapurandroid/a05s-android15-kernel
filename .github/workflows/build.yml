name: Build KernelSU Next + SuSFS (A05s OneUI 7 / A15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libsqlite3-dev libgmp-dev libmpfr-dev libmpc-dev libglib2.0-dev libpixman-1-dev python3 liblz4-tool git ccache zip clang-17 lld-17 llvm-17

      - name: Setup Clang & Toolchain Paths
        run: |
          # Buat direktori symlink untuk Clang agar dikenali oleh skrip build Samsung
          mkdir -p $GITHUB_WORKSPACE/bin
          mkdir -p $GITHUB_WORKSPACE/kernel_platform/prebuilts/bin
          mkdir -p $GITHUB_WORKSPACE/kernel_platform/prebuilts-master/bin
          
          ln -sf /usr/bin/clang-17 $GITHUB_WORKSPACE/bin/clang
          ln -sf /usr/bin/ld.lld-17 $GITHUB_WORKSPACE/bin/ld.lld
          
          ln -sf /usr/bin/clang-17 $GITHUB_WORKSPACE/kernel_platform/prebuilts/bin/clang
          ln -sf /usr/bin/clang-17 $GITHUB_WORKSPACE/kernel_platform/prebuilts-master/bin/clang
          
          echo "Toolchain Clang 17 Native Berhasil Dikonfigurasi!"

      - name: Inject KernelSU Next & SuSFS
        run: |
          cd $GITHUB_WORKSPACE
          
          # Cari folder kernel utama secara dinamis yang berisi folder drivers/ dan fs/
          KERNEL_DIR=$(find kernel_platform/ -type d -name "drivers" -exec dirname {} \; | head -n 1)
          echo "Kernel Directory ditemukan di: $KERNEL_DIR"
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          
          # Masuk ke folder kernel utama
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          
          # Inject KernelSU Next (Gunakan curl dan eksekusi di lokasi kernel)
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # Clone SuSFS khusus Kernel 5.15
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-5.15 susfs
          
          # Apply Patch to KernelSU Next
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KERNEL_DIR/KernelSU-Next/
          cd $KERNEL_DIR/KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
          # Apply Patch to Kernel VFS/FS
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-5.10.patch ./ 2>/dev/null || cp $GITHUB_WORKSPACE/susfs/kernel_patches/*.patch ./ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          
          patch -p1 < 50_add_susfs_in_kernel-5.10.patch || true
          
      - name: Enable KSU & SuSFS Configurations
        run: |
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*a057f*" -o -name "*gki*" -o -name "*defconfig*" | head -n 1)
          echo "Menggunakan Config File: $DEFCONFIG_FILE"
          
          # Pastikan konfigurasi SuSFS dan KSU aktif
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i '/CONFIG_KSU_SUSFS/d' $DEFCONFIG_FILE 2>/dev/null || true
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUM=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $DEFCONFIG_FILE
          
      - name: Compile Kernel via Samsung Official Script
        run: |
          cd $GITHUB_WORKSPACE
          
          # Export Environment Variables Sesuai README.txt & build_kernel_GKI.sh Samsung
          export BUILD_TARGET=a05s_eur_open
          export MODEL=$(echo ${BUILD_TARGET} | cut -d'_' -f1)
          export PROJECT_NAME=${MODEL}
          export REGION=$(echo ${BUILD_TARGET} | cut -d'_' -f2)
          export CARRIER=$(echo ${BUILD_TARGET} | cut -d'_' -f3)
          export TARGET_BUILD_VARIANT=user
          
          export CHIPSET_NAME=sm6225
          export ANDROID_BUILD_TOP=$(pwd)
          export TARGET_PRODUCT=gki
          export TARGET_BOARD_PLATFORM=gki
          
          export ANDROID_PRODUCT_OUT=${ANDROID_BUILD_TOP}/out/target/product/${MODEL}
          export OUT_DIR=${ANDROID_BUILD_TOP}/out/msm-kernel-${CHIPSET_NAME}-${TARGET_PRODUCT}
          export MODNAME=audio_dlkm
          
          # Lcd & Audio Driver Export Symbols (Sesuai README.txt & build_kernel_GKI.sh)
          export KBUILD_EXTRA_SYMBOLS="${ANDROID_BUILD_TOP}/out/vendor/qcom/opensource/mmrm-driver/Module.symvers \
              ${ANDROID_BUILD_TOP}/out/vendor/qcom/opensource/mm-drivers/hw_fence/Module.symvers \
              ${ANDROID_BUILD_TOP}/out/vendor/qcom/opensource/mm-drivers/sync_fence/Module.symvers \
              ${ANDROID_BUILD_TOP}/out/vendor/qcom/opensource/mm-drivers/msm_ext_display/Module.symvers \
              ${ANDROID_BUILD_TOP}/out/vendor/qcom/opensource/securemsm-kernel/Module.symvers"

          export KBUILD_EXT_MODULES="../vendor/qcom/opensource/mm-drivers/msm_ext_display \
            ../vendor/qcom/opensource/mm-drivers/sync_fence \
            ../vendor/qcom/opensource/mm-drivers/hw_fence \
            ../vendor/qcom/opensource/mmrm-driver \
            ../vendor/qcom/opensource/securemsm-kernel \
            ../vendor/qcom/opensource/display-drivers/msm \
            ../vendor/qcom/opensource/audio-kernel \
            ../vendor/qcom/opensource/camera-kernel"
          
          # Tambahkan Toolchain ke PATH
          export PATH="$GITHUB_WORKSPACE/bin:$GITHUB_WORKSPACE/kernel_platform/prebuilts/bin:$PATH"
          
          # Beri Akses Eksekusi Skrip Build
          chmod +x build_kernel_GKI.sh
          chmod +x kernel_platform/build/android/prepare_vendor.sh 2>/dev/null || true
          
          # Eksekusi skrip resmi Samsung
          ./build_kernel_GKI.sh a05s_eur_open user sm6225

      - name: Package Output
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p output
          find . -name "Image" -o -name "Image.gz" -o -name "*.ko" | xargs -I {} cp {} output/ 2>/dev/null || true
          cd output
          zip -r $GITHUB_WORKSPACE/kernel_susfs_a05s.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SuSFS-A05s-A15
          path: kernel_susfs_a05s.zip
