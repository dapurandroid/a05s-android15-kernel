name: Build KernelSU Next + SuSFS (A05s OneUI 7 / A15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies (Super Kilat + BPF Fix)
        run: |
          sudo apt-get update
          # [TAMBAHAN BARU] Memasukkan 'libelf-dev' ke daftar instalasi untuk menyembuhkan error libelf.h
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libsqlite3-dev libgmp-dev libmpfr-dev libmpc-dev libglib2.0-dev libpixman-1-dev python3 liblz4-tool git ccache zip dos2unix clang-17 lld-17 llvm-17 libelf-dev
          find . -type f -name "*.sh" -exec dos2unix {} +
          
          # Memaku Clang dan LLD ke sistem dasar
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang-17 /bin/clang
          sudo ln -sf /usr/bin/ld.lld-17 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/ld.lld-17 /bin/ld.lld
          
          # [TAMBAHAN BARU] Memaku LLVM tools agar tidak "not found" saat perakitan BPF
          sudo ln -sf /usr/bin/llvm-ar-17 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ar-17 /bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-17 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-nm-17 /bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-17 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-strip-17 /bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-17 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objcopy-17 /bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-17 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-objdump-17 /bin/llvm-objdump

      - name: Inject KernelSU Next & SuSFS (Targeted Version)
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL_DIR="kernel_platform/common"
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs
          
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KERNEL_DIR/KernelSU-Next/
          cd $KERNEL_DIR/KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          
          # HANYA MENGAMBIL PATCH KERNEL 5.10+ (Cocok untuk GKI 5.15)
          # Mengabaikan patch lawas untuk mencegah error "redefinition" dan "mmap_sem"
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-5.10+.patch ./ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          
          echo "Menerapkan SuSFS untuk Kernel Modern..."
          patch -p1 < 50_add_susfs_in_kernel-5.10+.patch || true

      - name: Enable KSU, SuSFS, Disable DEFEX, & Disable LTO
        run: |
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*a057f*" -o -name "*gki*" -o -name "*defconfig*" | head -n 1)
          
          # Disable Samsung Security
          sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_SAMSUNG_DEFEX=y/# CONFIG_SAMSUNG_DEFEX is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          
          # Enable KSU & SuSFS
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i '/CONFIG_KSU_SUSFS/d' $DEFCONFIG_FILE 2>/dev/null || true
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUM=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $DEFCONFIG_FILE
          
          # [TAMBAHAN BARU] DISABLE LTO (Mencegah Out of Memory / Crash di vmlinux.o)
          echo "Mematikan LTO agar RAM GitHub Actions tidak jebol..."
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/# CONFIG_LTO_CLANG_FULL is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG_FILE

      - name: Prepare LKM & Blacklist sec.ko
        run: |
          cd $GITHUB_WORKSPACE
          find vendor/qcom/opensource -name "Makefile" -type f -exec sed -i '/sec_common/d' {} + || true
          find vendor/qcom/opensource -name "Kconfig" -type f -exec sed -i 's/source "vendor\/qcom\/opensource\/sec_common\/Kconfig"//g' {} + || true
          mkdir -p kernel_platform/vendor/qcom/opensource/modules
          echo "blacklist sec" > kernel_platform/vendor/qcom/opensource/modules/modules.blocklist

      - name: Compile Kernel via Google Build System (True Hermetic Target)
        run: |
          cd $GITHUB_WORKSPACE/kernel_platform
          
          # 1. ROOT SYMLINK BUILD
          sudo rm -rf /build 2>/dev/null || true
          mkdir -p build
          cat << 'EOF' > build/gettop.sh
          gettop() {
              echo "${ANDROID_BUILD_TOP:-$PWD}"
          }
          EOF
          chmod +x build/gettop.sh
          sudo ln -sf $GITHUB_WORKSPACE/kernel_platform/build /build
          
          # 2. PHYSICAL CLONE
          cp msm-kernel/build.config.* common/ 2>/dev/null || true
          cp common/build.config.* msm-kernel/ 2>/dev/null || true
          mkdir -p kernel_platform
          cp -a common kernel_platform/ 2>/dev/null || true
          cp -a msm-kernel kernel_platform/ 2>/dev/null || true
          find . -name "build.config.msm.common" -exec cp {} kernel_platform/common/ \; 2>/dev/null || true
          find . -name "build.config.msm.gki" -exec cp {} kernel_platform/common/ \; 2>/dev/null || true
          find . -name "build.config.msm.common" -exec cp {} common/ \; 2>/dev/null || true
          find . -name "build.config.msm.gki" -exec cp {} common/ \; 2>/dev/null || true
          
          # 3 & 4. THE TRUE HERMETIC TRAP & SYSROOT MERGE (Struktur Presisi)
          echo "Membersihkan rintangan dan merakit sysroot fisik..."
          TRUE_SANDBOX="build/kernel/build-tools"
          
          # HANCURKAN file/symlink lama
          sudo rm -rf $TRUE_SANDBOX/sysroot 2>/dev/null || true
          
          # Buat lorong direktori OS Linux yang 100% identik dengan Ubuntu
          mkdir -p $TRUE_SANDBOX/path/linux-x86
          mkdir -p $TRUE_SANDBOX/sysroot/usr/include
          mkdir -p $TRUE_SANDBOX/sysroot/usr/lib/x86_64-linux-gnu
          mkdir -p $TRUE_SANDBOX/sysroot/lib/x86_64-linux-gnu
          mkdir -p $TRUE_SANDBOX/sysroot/lib64
          
          # Injeksi Utilitas (Mencegah nproc, tr, sed hilang)
          sudo ln -sf /usr/bin/* $TRUE_SANDBOX/path/linux-x86/ 2>/dev/null || true
          sudo ln -sf /bin/* $TRUE_SANDBOX/path/linux-x86/ 2>/dev/null || true
          
          # Injeksi Sysroot Fisik Terstruktur (Mencegah libc.so patah arah)
          sudo cp -rL /usr/include/* $TRUE_SANDBOX/sysroot/usr/include/ 2>/dev/null || true
          sudo cp -rL /usr/lib/x86_64-linux-gnu/* $TRUE_SANDBOX/sysroot/usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
          sudo cp -rL /lib/x86_64-linux-gnu/* $TRUE_SANDBOX/sysroot/lib/x86_64-linux-gnu/ 2>/dev/null || true
          sudo cp -rL /lib64/* $TRUE_SANDBOX/sysroot/lib64/ 2>/dev/null || true
          sudo cp -rL /usr/lib/gcc $TRUE_SANDBOX/sysroot/usr/lib/ 2>/dev/null || true
          
          # 5. TRIK NDK DUMMY
          mkdir -p prebuilts/ndk-r23/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          mkdir -p prebuilts/ndk
          mkdir -p $GITHUB_WORKSPACE/prebuilts/ndk
          
          # 6. KUNCI ENVIRONMENT VARIABLES & EKSEKUSI
          export ROOT_DIR=$GITHUB_WORKSPACE/kernel_platform
          export DEBIAN_FRONTEND=noninteractive
          export COPY_NEEDED=0
          
          export BUILD_CONFIG=msm-kernel/build.config.msm.m269.sec
          export CHIPSET_NAME=sm6225
          export TARGET_PRODUCT=gki
          export OUT_DIR=$GITHUB_WORKSPACE/out
          mkdir -p $OUT_DIR
          
          export LLVM=1
          export CC=clang
          export HOSTCC=clang
          
          echo "Memulai kompilasi kernel Super Cepat (Target Terkunci)..."
          chmod +x build/build.sh
          ./build/build.sh

      - name: Package Output
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p output
          find . -name "Image" -o -name "Image.gz" -o -name "*.ko" | grep -v "sec.ko" | xargs -I {} cp {} output/ 2>/dev/null || true
          cd output
          zip -r $GITHUB_WORKSPACE/kernel_susfs_a05s.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SuSFS-A05s-A15
          path: kernel_susfs_a05s.zip
