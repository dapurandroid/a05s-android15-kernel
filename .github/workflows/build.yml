name: Build KernelSU Next + SuSFS (The Ravindu Way)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
          python3 bc cpio tar wget curl git-core zlib1g-dev liblz4-tool libncurses5-dev clang \
          llvm lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu jq rsync python3-pip zip dwarves

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Inject KernelSU Next & SuSFS
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL_DIR="kernel_platform/common"
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs
          
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KERNEL_DIR/KernelSU-Next/
          cd $KERNEL_DIR/KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-5.10+.patch ./ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          patch -p1 < 50_add_susfs_in_kernel-5.10+.patch || true

      - name: Enable KSU, Disable Knox, & Disable LTO (Fast Build)
        run: |
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          
          echo "1. Membantai Knox & DEFEX di SELURUH file konfigurasi (Anti Auto-Override)..."
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SAMSUNG_DEFEX=y/# CONFIG_SAMSUNG_DEFEX is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SECURITY_PROCA=y/# CONFIG_SECURITY_PROCA is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SAMSUNG_PROCA=y/# CONFIG_SAMSUNG_PROCA is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SAMSUNG_RKP=y/# CONFIG_SAMSUNG_RKP is not set/g' {} +
          
          echo "2. Menentukan target utama untuk injeksi SuSFS & KSU..."
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*a057f*" -o -name "*gki*" -o -name "*defconfig*" | head -n 1)
          
          echo "3. Menyuntikkan KSU dan SuSFS ke $DEFCONFIG_FILE..."
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i '/CONFIG_KSU_SUSFS/d' $DEFCONFIG_FILE 2>/dev/null || true
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUM=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $DEFCONFIG_FILE
          
          echo "4. Mematikan LTO dan Modversions..."
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG_FILE
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/# CONFIG_LTO_CLANG_FULL is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          echo "CONFIG_MODVERSIONS=n" >> $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          
          echo "5. Mematikan BTF Debugging agar tidak error pahole..."
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/# CONFIG_DEBUG_INFO_BTF is not set/g' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i 's/CONFIG_DEBUG_INFO_BTF_MODULES=y/# CONFIG_DEBUG_INFO_BTF_MODULES is not set/g' $DEFCONFIG_FILE 2>/dev/null || true

      - name: Compile Kernel
        run: |
          echo "1. Menyiapkan Dapur Murni..."
          cd $GITHUB_WORKSPACE/kernel_platform
          
          sudo rm -rf /build 2>/dev/null || true
          mkdir -p build
          cat << 'EOF' > build/gettop.sh
          gettop() {
              echo "${ANDROID_BUILD_TOP:-$PWD}"
          }
          EOF
          chmod +x build/gettop.sh
          sudo ln -sf $GITHUB_WORKSPACE/kernel_platform/build /build
          
          cp msm-kernel/build.config.* common/ 2>/dev/null || true
          cp common/build.config.* msm-kernel/ 2>/dev/null || true
          mkdir -p kernel_platform
          cp -a common kernel_platform/ 2>/dev/null || true
          cp -a msm-kernel kernel_platform/ 2>/dev/null || true
          find . -name "build.config.msm.common" -exec cp {} kernel_platform/common/ \; 2>/dev/null || true
          find . -name "build.config.msm.gki" -exec cp {} kernel_platform/common/ \; 2>/dev/null || true
          find . -name "build.config.msm.common" -exec cp {} common/ \; 2>/dev/null || true
          find . -name "build.config.msm.gki" -exec cp {} common/ \; 2>/dev/null || true
          
          TRUE_SANDBOX="build/kernel/build-tools"
          sudo rm -rf $TRUE_SANDBOX/sysroot 2>/dev/null || true
          mkdir -p $TRUE_SANDBOX/path/linux-x86
          mkdir -p $TRUE_SANDBOX/sysroot/usr/include
          mkdir -p $TRUE_SANDBOX/sysroot/usr/lib/x86_64-linux-gnu
          mkdir -p $TRUE_SANDBOX/sysroot/lib/x86_64-linux-gnu
          mkdir -p $TRUE_SANDBOX/sysroot/lib64
          sudo ln -sf /usr/bin/* $TRUE_SANDBOX/path/linux-x86/ 2>/dev/null || true
          sudo ln -sf /bin/* $TRUE_SANDBOX/path/linux-x86/ 2>/dev/null || true
          sudo cp -rL /usr/include/* $TRUE_SANDBOX/sysroot/usr/include/ 2>/dev/null || true
          sudo cp -rL /usr/lib/x86_64-linux-gnu/* $TRUE_SANDBOX/sysroot/usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
          sudo cp -rL /lib/x86_64-linux-gnu/* $TRUE_SANDBOX/sysroot/lib/x86_64-linux-gnu/ 2>/dev/null || true
          sudo cp -rL /lib64/* $TRUE_SANDBOX/sysroot/lib64/ 2>/dev/null || true
          sudo cp -rL /usr/lib/gcc $TRUE_SANDBOX/sysroot/usr/lib/ 2>/dev/null || true
          
          mkdir -p prebuilts/ndk-r23/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          mkdir -p prebuilts/ndk
          mkdir -p $GITHUB_WORKSPACE/prebuilts/ndk
          
          export ROOT_DIR=$GITHUB_WORKSPACE/kernel_platform
          export DEBIAN_FRONTEND=noninteractive
          export COPY_NEEDED=0
          export BUILD_CONFIG=msm-kernel/build.config.msm.m269.sec
          export CHIPSET_NAME=sm6225
          export TARGET_PRODUCT=gki
          export OUT_DIR=$GITHUB_WORKSPACE/out
          mkdir -p $OUT_DIR
          export LLVM=1
          export CC=clang
          export HOSTCC=clang
          
          echo "2. Mematikan LTO untuk mempercepat kompilasi..."
          export LTO=none
          export LTO_CLANG=none
          export MAKEFLAGS="-j3"
          
          echo "3. Mengeksekusi Koki Google (Memasak Image selama ~22 Menit)..."
          chmod +x build/build.sh
          ./build/build.sh -j3 || true
          
          echo "4. MENGHANCURKAN GEMBOK MAKEFILE QUALCOMM..."
          # Ini adalah kunci mutlak. Mengubah obj-$(CONFIG_XYZ) menjadi obj-m (wajib kompilasi)
          find $GITHUB_WORKSPACE/vendor/qcom/opensource -name "Makefile" -type f -exec sed -i 's/obj-\$(CONFIG_[a-zA-Z0-9_]*)/obj-m/g' {} +
          
          echo "5. RAW MAKE: MEMASAK DRIVER OOT SECARA MANUAL!"
          export KERNEL_OUT_DIR=$GITHUB_WORKSPACE/out/gki_kernel/kernel_platform/common
          
          # Menghubungkan simbol antar driver agar tidak error saat linking
          export KBUILD_EXTRA_SYMBOLS="$KERNEL_OUT_DIR/../vendor/qcom/opensource/mmrm-driver/Module.symvers $KERNEL_OUT_DIR/../vendor/qcom/opensource/mm-drivers/hw_fence/Module.symvers $KERNEL_OUT_DIR/../vendor/qcom/opensource/mm-drivers/sync_fence/Module.symvers $KERNEL_OUT_DIR/../vendor/qcom/opensource/mm-drivers/msm_ext_display/Module.symvers $KERNEL_OUT_DIR/../vendor/qcom/opensource/securemsm-kernel/Module.symvers"
          
          # Daftar driver OOT
          OOT_MODULES="vendor/qcom/opensource/mmrm-driver vendor/qcom/opensource/mm-drivers/hw_fence vendor/qcom/opensource/mm-drivers/sync_fence vendor/qcom/opensource/mm-drivers/msm_ext_display vendor/qcom/opensource/securemsm-kernel vendor/qcom/opensource/display-drivers/msm vendor/qcom/opensource/audio-kernel vendor/qcom/opensource/camera-kernel"
          
          cd $GITHUB_WORKSPACE
          for MODULE_DIR in $OOT_MODULES; do
              echo "Memasak Manual Modul OOT: $MODULE_DIR"
              make -C $KERNEL_OUT_DIR M=$GITHUB_WORKSPACE/$MODULE_DIR ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 modules || echo "PERINGATAN: Gagal memasak $MODULE_DIR"
          done
          
      - name: Package Output (Full Modules Extract)
        run: |
          # Buat folder output di root workspace
          mkdir -p $GITHUB_WORKSPACE/output/modules
          
          echo "Mencari File Image di SELURUH sudut repositori..."
          find $GITHUB_WORKSPACE -name "Image" -type f -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
          
          echo "Mencari File Driver (.ko) di SELURUH sudut repositori..."
          find $GITHUB_WORKSPACE -name "*.ko" -type f -exec cp {} $GITHUB_WORKSPACE/output/modules/ \; 2>/dev/null || true
          
          # ==========================================
          # EKSEKUSI BLACKLIST: Buang modul berbahaya!
          # ==========================================
          echo "Mengeksekusi Blacklist: Membuang modul yang bikin bootloop..."
          cd $GITHUB_WORKSPACE/output/modules
          rm -f sec.ko
          # Jika nanti Anda menemukan modul lain yang bermasalah, tinggal tambahkan di bawah ini:
          # rm -f nama_modul_lain.ko
          # ==========================================
          
          cd $GITHUB_WORKSPACE/output
          
          echo "=== DEBUG: Isi folder hasil panen kita ==="
          ls -lh
          echo "=== DEBUG: Beberapa file .ko yang berhasil ditangkap ==="
          ls -lh modules/ | head -n 15
          
          zip -r Kernel_A05s_KSU_Modules.zip Image modules/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_SuSFS_A05s_Modules
          path: output/Kernel_A05s_KSU_Modules.zip
