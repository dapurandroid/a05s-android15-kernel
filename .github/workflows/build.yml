name: Build KernelSU Next + SuSFS (A05s OneUI 7 / A15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. MAKSIMALKAN RUANG DULU SEBELUM MENGUNDUH KODE
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # 2. BARU UNDUH KODE KE HARDISK YANG SUDAH KOSONG DAN BESAR
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libsqlite3-dev libgmp-dev libmpfr-dev libmpc-dev libglib2.0-dev libpixman-1-dev python3 liblz4-tool git ccache zip clang-17 lld-17 llvm-17

      - name: Setup Clang & Toolchain Paths
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin
          mkdir -p $GITHUB_WORKSPACE/kernel_platform/prebuilts/bin
          mkdir -p $GITHUB_WORKSPACE/kernel_platform/prebuilts-master/bin
          
          ln -sf /usr/bin/clang-17 $GITHUB_WORKSPACE/bin/clang
          ln -sf /usr/bin/ld.lld-17 $GITHUB_WORKSPACE/bin/ld.lld
          
          ln -sf /usr/bin/clang-17 $GITHUB_WORKSPACE/kernel_platform/prebuilts/bin/clang
          ln -sf /usr/bin/clang-17 $GITHUB_WORKSPACE/kernel_platform/prebuilts-master/bin/clang
          
          echo "Toolchain Clang 17 Native Berhasil Dikonfigurasi!"

      - name: Inject KernelSU Next & SuSFS
        run: |
          cd $GITHUB_WORKSPACE
          
          echo "Mencari direktori kernel GKI..."
          if [ -d "kernel_platform/common/drivers" ]; then
            KERNEL_DIR="kernel_platform/common"
          elif [ -d "kernel_platform/msm-kernel/drivers" ]; then
            KERNEL_DIR="kernel_platform/msm-kernel"
          else
            echo "[ERROR] Folder drivers/ tidak ditemukan di common maupun msm-kernel!"
            echo "Menampilkan isi root kernel_platform untuk debugging:"
            ls -la kernel_platform/
            exit 1
          fi
          
          echo "Kernel Directory valid ditemukan di: $KERNEL_DIR"
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          
          echo "Menyuntikkan KernelSU Next..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs
          
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KERNEL_DIR/KernelSU-Next/
          cd $KERNEL_DIR/KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-*.patch ./ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          
          for patchfile in 50_add_susfs_in_kernel-*.patch; do
            if [ -f "$patchfile" ]; then
              echo "Menerapkan patch: $patchfile"
              patch -p1 < "$patchfile" || true
            fi
          done

      - name: Enable KSU & SuSFS Configurations
        run: |
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*a057f*" -o -name "*gki*" -o -name "*defconfig*" | head -n 1)
          echo "Menggunakan Config File: $DEFCONFIG_FILE"
          
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i '/CONFIG_KSU_SUSFS/d' $DEFCONFIG_FILE 2>/dev/null || true
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUM=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $DEFCONFIG_FILE

      - name: Compile Kernel via Google Build System (Sed Patch Method)
        run: |
          # 1. Normalisasi format baris
          sudo apt-get install dos2unix -y
          find . -type f -name "*.sh" -exec dos2unix {} +
          find . -type f -name "build.config.*" -exec dos2unix {} +
          
          cd $GITHUB_WORKSPACE/kernel_platform
          
          # 2. MENEBAS AKAR MASALAH (SED PATCHING)
          # Menghapus string "kernel_platform/" yang hardcoded secara keliru
          echo "Memperbaiki hardcoded paths di file konfigurasi Samsung/Qualcomm..."
          find . -type f -name "build.config.*" -exec sed -i 's|kernel_platform/||g' {} +
          
          # 3. Kunci Environment Variables Bawaan Google
          export DEBIAN_FRONTEND=noninteractive
          export COPY_NEEDED=0
          
          export BUILD_CONFIG=msm-kernel/build.config.msm.m269.sec
          export CHIPSET_NAME=sm6225
          export TARGET_PRODUCT=gki
          
          # 4. Lempar output ke luar folder agar tidak mengganggu tree kernel
          export OUT_DIR=$GITHUB_WORKSPACE/out
          mkdir -p $OUT_DIR
          
          echo "Memulai kompilasi kernel Clang..."
          chmod +x build/build.sh
          
          # Eksekusi standar Google.
          ./build/build.sh
          
      - name: Package Output
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p output
          find . -name "Image" -o -name "Image.gz" -o -name "*.ko" | xargs -I {} cp {} output/ 2>/dev/null || true
          cd output
          zip -r $GITHUB_WORKSPACE/kernel_susfs_a05s.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SuSFS-A05s-A15
          path: kernel_susfs_a05s.zip
