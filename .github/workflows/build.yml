name: Build KernelSU Next + SuSFS (The Ravindu Way)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
          python3 bc cpio tar wget curl git-core zlib1g-dev liblz4-tool libncurses5-dev clang \
          llvm lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu jq rsync python3-pip zip dwarves

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Inject KernelSU Next & SuSFS
        run: |
          cd $GITHUB_WORKSPACE
          KERNEL_DIR="kernel_platform/common"
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs
          
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KERNEL_DIR/KernelSU-Next/
          cd $KERNEL_DIR/KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
          cd $GITHUB_WORKSPACE/$KERNEL_DIR
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-5.10+.patch ./ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          patch -p1 < 50_add_susfs_in_kernel-5.10+.patch || true

      - name: Inject KSU, SuSFS, & Disable Knox
        run: |
          cd $GITHUB_WORKSPACE/kernel_platform/common
          
          echo "1. Membantai Knox & DEFEX..."
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SAMSUNG_DEFEX=y/# CONFIG_SAMSUNG_DEFEX is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SECURITY_PROCA=y/# CONFIG_SECURITY_PROCA is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SAMSUNG_PROCA=y/# CONFIG_SAMSUNG_PROCA is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' {} +
          find arch/arm64/configs/ -type f -exec sed -i 's/CONFIG_SAMSUNG_RKP=y/# CONFIG_SAMSUNG_RKP is not set/g' {} +
          
          echo "2. Menyuntikkan KSU dan SuSFS..."
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*a057f*" -o -name "*gki*" -o -name "*defconfig*" | head -n 1)
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_FILE 2>/dev/null || true
          sed -i '/CONFIG_KSU_SUSFS/d' $DEFCONFIG_FILE 2>/dev/null || true
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUM=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $DEFCONFIG_FILE
          
          # Catatan: Kita membiarkan LTO bawaan pabrik (THIN LTO) tetap hidup agar struktur ABI stabil.

      - name: Compile Kernel & Harvest Modules (The True Ravindu Way)
        continue-on-error: true
        run: |
          echo "1. Mengunduh Asisten Panen (LKM_Tools)..."
          cd $GITHUB_WORKSPACE
          git clone https://github.com/ravindu644/LKM_Tools.git
          chmod -R +x LKM_Tools/*.sh
          
          echo "2. Menyiapkan Folder Pancingan NDK agar Skrip Samsung tidak mati..."
          mkdir -p $GITHUB_WORKSPACE/prebuilts/ndk-r23/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          mkdir -p $GITHUB_WORKSPACE/prebuilts/ndk
          mkdir -p $GITHUB_WORKSPACE/kernel_platform/prebuilts/ndk
          
          echo "Mengunci batas Thread untuk mengamankan RAM saat THIN LTO berjalan..."
          export MAKEFLAGS="-j3"
          
          echo "3. Mengeksekusi Skrip Master Samsung (Memasak Kernel & Ratusan Driver)..."
          chmod +x build_kernel_GKI.sh
          # Menggunakan || true agar jika gagal di tahap packaging akhir, proses panen LKM_Tools tetap tereksekusi
          ./build_kernel_GKI.sh a05s_global_gki userdebug sm6225 || true
          
          echo "4. MENCARI JALUR FILE PENTING (Staging, System.map, Strip Tool)..."
          STAGING_DIR=$(find $GITHUB_WORKSPACE/out -type d -name "staging" | head -n 1)
          SYSTEM_MAP=$(find $GITHUB_WORKSPACE/out -name "System.map" | head -n 1)
          STRIP_TOOL=$(find $GITHUB_WORKSPACE/kernel_platform/prebuilts -name "llvm-strip" | grep -v "ndk" | head -n 1)
          
          echo "=== DEBUG RADAR: CEK LOKASI FILE PENTING ==="
          echo "STAGING_DIR: $STAGING_DIR"
          echo "SYSTEM_MAP : $SYSTEM_MAP"
          echo "STRIP_TOOL : $STRIP_TOOL"
          echo "============================================"
          
          echo "5. EKSEKUSI LKM_TOOLS: Menerjemahkan modules.dep pabrik..."
          ./LKM_Tools/01.module_dep.sh prebuilts/vendor_boot/modules.dep prebuilts/vendor_boot
          ./LKM_Tools/01.module_dep.sh prebuilts/vendor_dlkm/modules.dep prebuilts/vendor_dlkm
          
          mkdir -p output/vendor_boot_modules
          mkdir -p output/vendor_dlkm_modules
          
          echo "6. EKSEKUSI LKM_TOOLS: Menyedot modul khusus vendor_boot..."
          ./LKM_Tools/02.prepare_vendor_boot_modules.sh \
            prebuilts/vendor_boot/modules_list.txt \
            $STAGING_DIR \
            prebuilts/vendor_boot/modules.load \
            $SYSTEM_MAP \
            $STRIP_TOOL \
            output/vendor_boot_modules
            
          echo "7. EKSEKUSI LKM_TOOLS: Menyedot modul vendor_dlkm (Pruning & Blacklist aktif)..."
          ./LKM_Tools/03.prepare_vendor_dlkm.sh \
            prebuilts/vendor_dlkm/modules_list.txt \
            $STAGING_DIR \
            prebuilts/vendor_dlkm/modules.load \
            $SYSTEM_MAP \
            $STRIP_TOOL \
            output/vendor_dlkm_modules \
            prebuilts/vendor_boot/modules_list.txt \
            "" \
            prebuilts/vendor_dlkm/modules.blacklist
            
          echo "8. Mengumpulkan Image & Mengemas Hasil Akhir..."
          find $GITHUB_WORKSPACE/out -name "Image" -type f -exec cp {} output/ \; 2>/dev/null || true
          cd output
          
          echo "=== DEBUG: HASIL PANEN FINAL ==="
          ls -lh vendor_boot_modules/ || true
          ls -lh vendor_dlkm_modules/ || true
          
          zip -r Kernel_A05s_KSU_SuSFS_Final.zip Image vendor_boot_modules/ vendor_dlkm_modules/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A05s_KSU_SuSFS_Final
          path: output/Kernel_A05s_KSU_SuSFS_Final.zip
